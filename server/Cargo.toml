[package]
name = "org-server"
version = "0.1.0"
edition = { workspace = true }

[[bin]]
path = "src/main.rs"
name = "org-server"

[dependencies]
org-parser = { path = "../parser" }
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
axum = { version = "0.8", features = ["http1", "tokio"], default-features = false }
tokio = { version = "1.0", features = ["fs", "io-util", "rt-multi-thread"] }
clap = { version = "4", features = ["derive", "std"], default-features = false }
globmatch = "0.3"
regex = { version = "1.5", default-features = false }
toml = { version = "0.8", features = ["parse"], default-features = false }
xdg = "2"
walkdir = "2"
futures = { version = "0.3", default-features = false }
notify-rust = { version = "4", features = ["serde", "zbus"], default-features = false }
notify = { version = "8", default-features = false }

[dev-dependencies]
tempfile = "3.8"
